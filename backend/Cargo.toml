[workspace]
resolver = "2"
members = [
    "common",
    "engine",
    "server",
    "worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OmniRecon Contributors"]
license = "AGPL-3.0"
repository = "https://github.com/omni-recon/omni-recon"

[workspace.dependencies]
# Serialization & Async
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Web & Networking
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }
jsonwebtoken = "9.3"
bcrypt = "0.15"

# Database & Cache
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "rust_decimal"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "aio"] }
duckdb = { version = "1.0", features = ["bundled"] }

# Data Processing
calamine = "0.24"
csv = "1.3"
rust_decimal = { version = "1.35", features = ["serde-float"] }
