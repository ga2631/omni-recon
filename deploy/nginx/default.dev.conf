upstream backend_api {
    server backend:8080 max_fails=0;
    keepalive 32;
}

upstream frontend_dev {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost _;

    client_max_body_size 250M;

    # Frontend Single Page Application & Vite HMR WebSocket
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_starting;
    }

    location @backend_starting {
        default_type application/json;
        return 503 '{"success":false,"error":"OmniRecon Backend đang khởi động hoặc biên dịch mã nguồn. Vui lòng thử lại sau giây lát...","status":"STARTING"}\n';
    }

    # Backend WebSocket for Realtime Progress & Alerts
    location /ws {
        proxy_pass http://backend_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
