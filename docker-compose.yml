services:
  # ============================================================================
  # 1. Reverse Proxy & API Gateway
  # ============================================================================
  gateway:
    image: nginx:stable-alpine
    container_name: omnirecon-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - omnirecon-network

  # ============================================================================
  # 2. Frontend UI (Vue 3 + Vite + Tailwind CSS)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    container_name: omnirecon-frontend
    restart: unless-stopped
    networks:
      - omnirecon-network

  # ============================================================================
  # 3. Backend API & DuckDB Reconciliation Engine (Rust Axum)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: omnirecon-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - APP_SECRET=${APP_SECRET:-omni-recon-super-secret-key-change-in-production-min32chars}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-omnirecon}:${POSTGRES_PASSWORD:-omnirecon_secure_password}@postgres:5432/${POSTGRES_DB:-omnirecon}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - DUCKDB_PATH=/app/data/omnirecon.duckdb
      - STORAGE_PATH=/app/data/storage
      - RUST_LOG=info,omni_server=info,omni_engine=info
    volumes:
      - omnirecon-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - omnirecon-network

  # ============================================================================
  # 4. Relational Database (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: omnirecon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnirecon}
      POSTGRES_USER: ${POSTGRES_USER:-omnirecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnirecon_secure_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnirecon} -d ${POSTGRES_DB:-omnirecon}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnirecon-network

  # ============================================================================
  # 5. In-Memory Task Queue & Cache (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: omnirecon-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnirecon-network

networks:
  omnirecon-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  omnirecon-data:
