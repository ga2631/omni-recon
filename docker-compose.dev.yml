services:
  postgres:
    image: postgres:16-alpine
    container_name: omnirecon-dev-postgres
    environment:
      POSTGRES_DB: omnirecon
      POSTGRES_USER: omnirecon
      POSTGRES_PASSWORD: omnirecon_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: omnirecon-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data

volumes:
  postgres-dev-data:
  redis-dev-data:
