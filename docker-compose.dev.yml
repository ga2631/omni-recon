services:
  # ============================================================================
  # 1. Reverse Proxy Gateway (Nginx with Vite HMR & API Proxy)
  # ============================================================================
  gateway:
    image: nginx:stable-alpine
    container_name: omnirecon-dev-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - omnirecon-dev-network

  # ============================================================================
  # 2. Frontend Dev Server (Vue 3 + Vite Hot Module Replacement)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend.dev
    container_name: omnirecon-dev-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - omnirecon-dev-network

  # ============================================================================
  # 3. Backend API (Rust Axum + DuckDB + Cargo Watch Hot-Reload)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend.dev
    container_name: omnirecon-dev-backend
    restart: unless-stopped
    working_dir: /usr/src/omni-recon/backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      - APP_SECRET=${APP_SECRET:-omni-recon-dev-secret-key-development-only}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-omnirecon}:${POSTGRES_PASSWORD:-omnirecon_secure_password}@postgres:5432/${POSTGRES_DB:-omnirecon}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - DUCKDB_PATH=/usr/src/omni-recon/data/omnirecon.duckdb
      - STORAGE_PATH=/usr/src/omni-recon/data/storage
      - RUST_LOG=info,omni_server=debug,omni_engine=debug
    volumes:
      - .:/usr/src/omni-recon
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/usr/src/omni-recon/backend/target
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 4s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - omnirecon-dev-network

  # ============================================================================
  # 4. Relational Database (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: omnirecon-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnirecon}
      POSTGRES_USER: ${POSTGRES_USER:-omnirecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnirecon_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnirecon} -d ${POSTGRES_DB:-omnirecon}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - omnirecon-dev-network

  # ============================================================================
  # 5. In-Memory Task Queue & Cache (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: omnirecon-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - omnirecon-dev-network

networks:
  omnirecon-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data:
  frontend-node-modules:
  cargo-cache:
  cargo-git:
  target-cache:
